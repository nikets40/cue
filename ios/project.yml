name: Cue
options:
  bundleIdPrefix: com.niket
  deploymentTarget:
    iOS: "17.0"
packages:
  CueKit:
    path: ../CueKit
targets:
  Cue:
    type: application
    platform: iOS
    sources: [Cue, Shared]
    dependencies:
      - package: CueKit
      - target: CueWidgets
    info:
      path: Cue/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Cue
        NSLocalNetworkUsageDescription: Cue connects to Cue Booth on your Mac to control media playback.
        NSBonjourServices: [_cue._tcp]
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niket.cue
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H5NF35596Y
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CueWidgets:
    type: app-extension
    platform: iOS
    sources: [CueWidgets, Shared]
    dependencies:
      - package: CueKit
    info:
      path: CueWidgets/Info.plist
      properties:
        CFBundleDisplayName: Cue Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niket.cue.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H5NF35596Y
